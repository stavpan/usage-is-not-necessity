[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-impact"
version = "0.1.0"
description = "An uncertainty-aware, multi-criteria basis for ranking world-historical developments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stavros Panagiotidis" }]
keywords = ["macrohistory", "cliometrics", "multi-criteria", "factor analysis", "tensor decomposition"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "typer>=0.12",
  "pyarrow>=15",
  "tensorly>=0.9",
  "SALib>=1.4.7",
  "requests>=2.31",
  "rich>=13",
]

[project.scripts]
world-impact = "world_impact.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.98", "ruff>=0.5", "mypy>=1.9",
       "pandas-stubs", "types-PyYAML"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/world_impact"]

# ---------------------------------------------------------------- quality --
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["reports", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "NPY", "PD"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PD", "N", "B008"]
"scripts/*" = ["PTH"]
# typer's documented API requires calling typer.Option() in the signature
# default, which B008 flags. This is the standard exemption for typer apps.
"src/world_impact/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "network: requires outbound network access (deselect with '-m \"not network\"')",
  "slow: runs the analysis pipeline; a few minutes, not a few seconds",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["src"]
branch = true
