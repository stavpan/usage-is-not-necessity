name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.72.2
          cache: true
          environments: dev

      - name: Lint
        run: pixi run -e dev lint

      - name: Type check
        run: pixi run -e dev typecheck

      - name: Tests
        run: pixi run -e dev pytest --cov=world_impact --cov-report=term-missing

      - name: Everything that needs no network
        run: pixi run -e dev all

  reproducibility:
    name: the analysis reproduces its own numbers
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.72.2
          cache: true
          environments: dev

      - name: Everything that needs no network
        # Fails if a committed figure or report has drifted from the code that
        # produces it. A figure that is not reproducible from a committed corpus is
        # an illustration, not a result.
        run: pixi run -e dev all

      - name: The tree is unchanged after a full rebuild
        run: |
          git diff --exit-code -- figures docs/figures \
            || { echo "::error::committed figures differ from regenerated output"; exit 1; }

      - name: The central claim, asserted
        run: |
          pixi run -e dev python - <<'PY'
          import json, pathlib, sys
          c = json.loads(pathlib.Path("reports/contrast.json").read_text())
          print(f"top-{c['top']} by use vs by necessity: {c['n_shared']} shared entries")
          if c["n_shared"] != 0:
              sys.exit("the two rankings are no longer disjoint -- investigate before merging")
          print(f"largest transitive reach: {c['by_necessity'][0]['transitive_reach']} of {c['n_nodes']}")
          PY

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.72.2
          cache: true
          environments: docs
      - run: pixi run -e docs docs-build
