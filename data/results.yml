# The fine layer: specific results, artefacts and papers.
#
# Why this file exists. The coarse layer says "electromagnetism mattered", which
# is true, uninformative, and the kind of claim nobody would dispute. This layer
# asks the question with content: *which* result did the work, and what does it
# depend on? Maxwell's displacement current and Hertz's demonstration are not the
# same intervention and do not have the same option value.
#
# Same schema as the coarse layer, so the same pipeline -- axes, nulls, SMAA,
# tensor, linkage -- runs here unchanged. That is what makes the comparison
# between resolutions a measurement rather than a rhetorical move.
#
# `parent`   the coarse development this result refines. Cross-resolution
#            coupling goes through this field only; `requires` never crosses
#            levels, so a fine row cannot silently inherit a coarse dependency.
# `requires` prerequisites *within this file*.
# `effects`  the result's own contribution, on the same 0-3 rubric. A parent
#            usually carries the per-outcome maximum of its children; where it
#            does not, world_impact.granularity reports the inconsistency.

