# ---------------------------------------------------------------- methods --
- key: arrow1951
  author: "Arrow, K. J."
  year: 1951
  title: "Social Choice and Individual Values"
  publisher: "Wiley"
  kind: book
  note: "Why no aggregate ranking can satisfy a small set of reasonable axioms at once; motivates reporting a frontier rather than an order."

- key: sen1970
  author: "Sen, A. K."
  year: 1970
  title: "Collective Choice and Social Welfare"
  publisher: "Holden-Day"
  kind: book
  note: "Interpersonal comparability and the informational basis of welfare judgements."

- key: lahdelma1998
  author: "Lahdelma, R.; Hokkanen, J.; Salminen, P."
  year: 1998
  title: "SMAA — Stochastic multiobjective acceptability analysis"
  venue: "European Journal of Operational Research"
  volume: "106(1):137-143"
  kind: article
  note: "Rank acceptability indices, central weight vectors, confidence factors. The method we use for ranking under uncertainty."

- key: saltelli2008
  author: "Saltelli, A. et al."
  year: 2008
  title: "Global Sensitivity Analysis: The Primer"
  publisher: "Wiley"
  kind: book
  note: "Variance-based sensitivity; the basis for attributing rank variation to specific coding decisions."

- key: sobol2001
