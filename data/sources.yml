  kind: article

- key: horn1965
  author: "Horn, J. L."
  year: 1965
  title: "A rationale and test for the number of factors in factor analysis"
  venue: "Psychometrika"
  volume: "30(2):179-185"
  doi: "10.1007/BF02289447"
  kind: article
  verified: true
  note: "Parallel analysis. Replaces the arbitrary choice of how many axes to keep."

- key: glorfeld1995
  author: "Glorfeld, L. W."
  year: 1995
  title: "An improvement on Horn's parallel analysis methodology for selecting the correct number of factors to retain"
  venue: "Educational and Psychological Measurement"
  volume: "55(3):377-393"
  kind: article

- key: zwick1986
  author: "Zwick, W. R.; Velicer, W. F."
  year: 1986
