# The enabling graph.
#
# Orientation: `user` depended on `provider`. Each row is the claim "X would not
# have been possible, as it occurred, without Y". Each edge is a binary, citable
# assertion, which is why this graph is a better substrate for inter-coder
# agreement than the 1-3 magnitudes: "was A necessary for B?" has a far higher
# agreement rate than "was this a 2 or a 3?".
#
# This file exists because a matrix of direct effects cannot represent a mediated
# cause. See world_impact/linkage.py.
#
# Direction is NOT assumed to run from knowledge to capability. One edge below
# deliberately runs the other way, because the linear model of innovation is false
# in its strong form (Kline & Rosenberg 1986) and the interesting result is where
# it fails: `coal_steam -> thermodynamics` -- the engine came first, the theory
# came eighty years later.

# --- roots (fire, hunting, language, domestication have no providers) -----
