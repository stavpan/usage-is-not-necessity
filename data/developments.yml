# ---------------------------------------------------------------------------
# THE KNOWLEDGE LAYER
#
# These rows exist because a body of understanding is not a deployable
# intervention, so it can never be a row of an outcome-impact matrix on its own
# terms -- which is precisely why quantum mechanics was missing from the first
# draft. Their direct effects are necessarily tiny and slightly artificial: the
# outcome set has no column for "stock of validated explanatory models", so the
# nearest available proxies are information and, where the theory reached
# medicine, health. That proxy understates them by construction.
#
# Their real contribution is supposed to arrive through the enabling graph in
# data/edges.yml, where forward linkage is measured instead of assumed. The
# knowledge_layer flag is used ONLY to read the seed hypothesis off the results;
# it never enters any score, weight or axis.
# ---------------------------------------------------------------------------

