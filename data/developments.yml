# The coded matrix: rows of impact.
#
# A DEVELOPMENT is a datable, documented intervention in the human career whose
# effects on outcome domains are reported in the scholarly literature. The list
# is a sample, not a census, and sampling is a known threat to validity
# (docs/methods.md#threats). It includes the information cluster and its
# competitors deliberately, and was written before any axis existed.
#
# effects: {outcome_id: magnitude} with the ordinal rubric
#   1 = substantial but bounded in space, time or domain
#   2 = large global or hemispheric shift
#   3 = transformed the domain at global scale
# The rubric is OUTCOME-NEUTRAL: catastrophe scores the same as cure.
# Rubric calibration and its ceiling effect are in docs/methods.md#rubric.
#
# extern: Seshat variable group(s), used as an EXTERNAL taxonomy for the
# inter-framework reliability check. Not used to build the axes.

