[workspace]
name = "world-impact"
description = "An uncertainty-aware, multi-criteria basis for ranking world-historical developments"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
world-impact = { path = ".", editable = true }

[feature.dev.pypi-dependencies]
pytest = ">=8"
pytest-cov = ">=5"
hypothesis = ">=6.98"
ruff = ">=0.5"
mypy = ">=1.9"
pandas-stubs = "*"
types-PyYAML = "*"

[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.24", extras = ["python"] }
# mkdocstrings reports an INFO (not a warning, so --strict passes) that
# signature formatting wants Black or Ruff present. Ruff lives in the dev
# feature; adding it here would force a re-solve for no functional gain.
# `pixi run -e docs docs-build` is clean as it stands.

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tasks]
# --- quality gates -------------------------------------------------------
test = { cmd = "pytest", description = "run the test suite" }
cov = { cmd = "pytest --cov=world_impact --cov-report=term-missing --cov-fail-under=70" }
lint = { cmd = "ruff check src tests", description = "lint" }
fmt = { cmd = "ruff format src tests && ruff check --fix src tests" }
typecheck = { cmd = "mypy src" }
gate = { depends-on = ["lint", "typecheck", "test"], description = "all quality gates" }

# --- pipeline ------------------------------------------------------------
validate = { cmd = "world-impact validate", description = "schema + provenance validation" }
fetch = { cmd = "world-impact fetch-reference", description = "download OWID reference series" }
fetch-openalex = { cmd = "python scripts/fetch_openalex.py --per-field 20", description = "build the automated corpus from OpenAlex (network)" }
figures-openalex = { cmd = "python scripts/make_figures.py", description = "figures + reports/fields.json for the automated layer" }
contrast = { cmd = "python scripts/make_contrast.py", description = "the paper's central figure: use vs necessity, and their overlap" }
analyse = { cmd = "world-impact analyse", description = "full analysis, writes reports/" }
figures = { cmd = "world-impact figures", description = "regenerate figures" }
report = { cmd = "world-impact report", description = "render the markdown report" }
pipeline = { depends-on = ["validate", "analyse", "figures", "report"] }
all = { depends-on = ["gate", "pipeline"], description = "everything, from a clean checkout" }

# --- docs ----------------------------------------------------------------
docs = { cmd = "mkdocs serve", description = "serve documentation" }
docs-build = { cmd = "mkdocs build --strict" }
