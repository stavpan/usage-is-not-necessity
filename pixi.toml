[workspace]
name = "world-impact"
description = "Usage is not necessity: two instruments for measuring scientific importance, and a landscape tool built on the result"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
world-impact = { path = ".", editable = true }

[feature.dev.pypi-dependencies]
pytest = ">=8"
pytest-cov = ">=5"
hypothesis = ">=6.98"
ruff = ">=0.5"
mypy = ">=1.9"
pandas-stubs = "*"
types-PyYAML = "*"

[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.24", extras = ["python"] }
# mkdocstrings reports an INFO (not a warning, so --strict passes) that
# signature formatting wants Black or Ruff present. Ruff lives in the dev
# feature; adding it here would force a re-solve for no functional gain.
# `pixi run -e docs docs-build` is clean as it stands.

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tasks]
# --- quality gates -------------------------------------------------------
test = { cmd = "pytest", description = "run the test suite" }
cov = { cmd = "pytest --cov=world_impact --cov-report=term-missing --cov-fail-under=70" }
lint = { cmd = "ruff check src tests scripts", description = "lint" }
fmt = { cmd = "ruff format src tests scripts && ruff check --fix src tests scripts" }
typecheck = { cmd = "mypy src" }
gate = { depends-on = ["lint", "typecheck", "test"], description = "all quality gates" }

# --- fetch (network; cached to data/, so each runs once) -----------------
fetch-openalex = { cmd = "python scripts/fetch_openalex.py --per-field 20", description = "the corpus: 520 seeds, their references, their citers" }
fetch-abstracts = { cmd = "python scripts/fetch_abstracts.py", description = "abstracts for the seeds, for classification" }
fetch-contexts = { cmd = "python scripts/fetch_contexts.py", description = "citation contexts (Semantic Scholar; needs a key)" }
fetch-literature = { cmd = "python scripts/fetch_literature.py", description = "verify the related-work anchors against Crossref" }
pool = { cmd = "python scripts/expand_pool.py", description = "the systematic candidate universe from Wikidata" }

# --- build (offline) -----------------------------------------------------
edges = { cmd = "python scripts/source_edges.py --write", description = "per-edge warrants + chronology and acyclicity audits" }
bibliography = { cmd = "python scripts/verify_bibliography.py", description = "grade the bibliography against Crossref" }
figures = { cmd = "python scripts/make_figures.py", description = "the bibliometric figures" }
contrast = { cmd = "python scripts/make_contrast.py", description = "the central figure, and the overlap number" }
measure = { cmd = "python scripts/reliability.py", description = "the five measures, the halo check, the second-coder export" }
classify = { cmd = "python scripts/classify_abstracts.py", description = "title vs abstract classification, and the disagreement" }

# --- use it --------------------------------------------------------------
# The landscape tool: both columns over the citation graph around a focus you choose,
# leading with the works the field depends on and does not cite. Network.
landscape = { cmd = "python scripts/landscape.py", description = "map a field: --doi, --openalex or --topic" }

# `all` deliberately does NOT depend on `gate`: the quality gates need the `dev`
# environment (ruff, mypy) while the build tasks are pure Python and run in the
# default one, so chaining them makes `pixi run all` fail with "ruff: command not
# found". CI runs the two separately, both in `dev`.
all = { depends-on = ["edges", "bibliography", "figures", "contrast"], description = "everything that needs no network" }

# --- docs ----------------------------------------------------------------
docs = { cmd = "mkdocs serve", description = "serve documentation" }
docs-build = { cmd = "mkdocs build --strict" }
