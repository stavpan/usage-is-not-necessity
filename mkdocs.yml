site_name: world-impact
site_description: An uncertainty-aware, multi-criteria basis for ranking world-historical developments
repo_url: https://github.com/stavpan/world-impact
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            separate_signature: true

nav:
  - Overview: index.md
  - Results, explained: results.md
  - Methods: methods.md
  - Decision log (incl. retractions): decisions.md
  - Literature review: literature.md
  - API reference:
      - Core (schema, data, measurement): reference/core.md
      - Analysis (structure, nulls, ranking): reference/analysis.md
      - Extensions (linkage, sensitivity, tensor): reference/extensions.md
      - Pipeline and reporting: reference/pipeline.md
